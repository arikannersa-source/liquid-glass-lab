name: Android SDK & Lab CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK (API 37)
        uses: android-actions/setup-android@v3

      - name: Install Android 17 Platform & Build-Tools 37.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify Zero-Dependency Plain-Java SDK (javac + d8)
        run: |
          mkdir -p /tmp/java_ci/classes /tmp/java_ci/dex
          javac -source 11 -target 11 -classpath "$ANDROID_HOME/platforms/android-37.0/android.jar" -d /tmp/java_ci/classes liquidglass-java/src/main/java/com/liquidglass/java/*.java examples/PlainJavaGameAndViewIntegration.java
          "$ANDROID_HOME/build-tools/37.0.0/d8" --min-api 33 --lib "$ANDROID_HOME/platforms/android-37.0/android.jar" --output /tmp/java_ci/dex releases/liquidglass-java-1.2.0.jar

      - name: Run Unit & Skia AGSL Optical Execution Tests
        run: ./gradlew test --console=plain

      - name: Assemble Reusable SDK AAR & Laboratory APK
        run: ./gradlew :liquidglass-sdk:assembleRelease :app:assembleRelease --console=plain
